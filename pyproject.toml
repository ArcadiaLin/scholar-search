[project]
name = "scholar-search"
version = "0.1.0"
description = "Research and engineering workspace for complex academic paper search"
requires-python = ">=3.11"
dependencies = [
    "deepxiv-sdk>=1.0.0",
    "httpx>=0.28.1",
    "metasci-universe",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.0,<2",
    "pyarrow>=25.0.1",
    "pytest>=8.4,<10",
    "pyyaml>=6,<7",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/metasci-universe",
]

[tool.uv.sources]
metasci-universe = { workspace = true, editable = true }

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    ".widi-scholar",
    "artifacts",
    "data",
    "papers",
    "packages/metasci-universe",
    "packages/widi",
    "references",
    "runs",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]
