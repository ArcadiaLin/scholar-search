repositories:
  - id: pasa
    url: https://github.com/bytedance/pasa.git
    revision: 2aaa6a9b1e48d24a2b7e21e8551f863dad9eeb84
    imported_at: 2026-08-15
    local_path: references/repos/pasa
    license: Apache-2.0
    purpose: Official PaSa agent, search tools, prompts, and metrics used as the reproduction baseline
    provenance: Read-only mirror. Code is migrated into project modules under Apache-2.0 with attribution; the clone itself is never edited or built in place.
    external_requirements:
      - name: transformers-fork
        url: https://github.com/hyc2026/transformers.git
        note: README requires this fork installed editable; the released checkpoints are not verified against upstream transformers.
      - name: pasa-7b-crawler
        url: https://huggingface.co/bytedance-research/pasa-7b-crawler
      - name: pasa-7b-selector
        url: https://huggingface.co/bytedance-research/pasa-7b-selector
      - name: serper
        url: https://google.serper.dev/search
        credential: SERPER_API_KEY

  - id: widi
    url: https://github.com/ArcadiaLin/widi.git
    revision: dd4c9ed601588b89113fc9fa04bf15ba3671db30
    imported_at: 2026-08-14
    local_path: packages/widi
    license: MIT
    purpose: Multi-agent runtime, terminal application, extension host, and benchmark RPC
    provenance: Git submodule pinned by the parent repository; update only through an explicit gitlink bump.
    upstream_components:
      - name: pi-agent-core
        package: "@earendil-works/pi-agent-core"
        base_version: 0.83.0
        local_package: "@arcadialin/agent-core"

  - id: asta-bench
    url: https://github.com/allenai/asta-bench.git
    revision: 5c844b7451e3a98cd0df71ea626bb217803d2bed
    imported_at: 2026-08-14
    local_path: references/repos/asta-bench
    license: Apache-2.0
    purpose: >-
      AstaBench / PaperFindingBench evaluation-protocol reference: query typing, LLM-judge with
      weighted relevance criteria, estimated-recall normalization, lower-bound-corrected nDCG,
      judgement caching, and end_date (inserted_before) enforcement.
    provenance: >-
      Read-only mirror; NOTICE.txt present. Asta Paper Finder itself is NOT in this repository —
      the agent source lives at https://github.com/allenai/asta-paper-finder and Ai2 accessed a
      deployed instance over HTTP during their own evaluation.
    entry_points:
      - astabench/evals/paper_finder/task.py
      - astabench/evals/paper_finder/eval.py
      - astabench/evals/paper_finder/relevance.py
      - astabench/evals/paper_finder/paper_finder_utils.py
      - astabench/tools/paper_finder_ai2i.py
    notes:
      - The local tree carries a 579 MB `.venv/` that is not part of upstream source; prune before re-import.
      - No training code: AstaBench is an evaluation harness built on inspect_ai.

  - id: litsearch
    url: https://github.com/princeton-nlp/LitSearch.git
    revision: 42107c06b0ed0ed02ff7836ec285d3df2f0e5b09
    imported_at: 2026-08-14
    local_path: references/repos/litsearch
    license: MIT
    purpose: LitSearch benchmark harness and its BM25 / dense-retriever baselines
    provenance: Read-only mirror.
    notes:
      - Local tree is 141 MB, dominated by prebuilt `retrieval_indices/`.

  - id: spar
    url: https://github.com/xiaofengShi/SPAR.git
    revision: 468c651e99cfac69beb343b2ed9f418ddc38f873
    imported_at: 2026-08-14
    local_path: references/repos/spar
    license: MIT (declared in README only — see compliance_risk)
    purpose: >-
      SPAR multi-agent scholar-retrieval pipeline; `rerank.py`, `search_node.py` and
      `pipeline_spar.py` are the rerank / judgement references.
    provenance: Read-only mirror.
    compliance_risk: >-
      README.md declares the MIT License and links to a LICENSE file, but no LICENSE file exists
      anywhere in the tree. Obtain written confirmation from upstream before migrating any code.

  - id: arxiv-mcp-server
    url: https://github.com/blazickjp/arxiv-mcp-server
    revision: 70723dff7d9b2facab94097fa46fde94996814f2
    imported_at: 2026-08-15
    local_path: references/repos/arxiv-mcp-server
    license: Apache-2.0
    purpose: >-
      MCP server exposing arXiv search/download as agent tools; interface reference for the
      passthrough mode in docs/search-service.md §2.1.
    provenance: Read-only mirror.

