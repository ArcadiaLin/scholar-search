# Scholar Search Service configuration.
# Sensitive values can be left empty here and provided via environment variables.

service:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"
  default_top_k: 20
  default_timeout_ms: 15000

# Operational bounds (theta^S_k). The agent does not set these; it is bounded by
# them. design.md §4 requires expansion depth, fan-out, concurrency and total
# candidate count to be bounded by configuration rather than by constants in the
# pipeline, so that an experiment can narrow them without a code change.
limits:
  expand:
    max_depth: 2
    max_seeds: 10
    max_fanout_per_seed: 25
    max_total_candidates: 200
    max_concurrency: 4
  facet:
    max_group_by: 3
  rank:
    max_candidates: 500
  fulltext:
    max_papers: 5
    max_sections: 20
    max_section_chars: 2000

# Relevance judging (L3b). The Configure edge for NP_k^judge: `carrier` points at
# the preference file whose entries reach the judging prompt, and everything
# numeric here is HP_k.
#
# `forced_level` is the J-axis operating surface. The agent normally decides how
# much judging to buy (`judge_level` on the search tool) because that is a strategy
# decision, but an ablation has to pin it: set this to `off` for the J0 arm and
# `l3b` for the J2 arm, and the effective value travels in the response so a run
# records which arm it was. Null means "obey the caller".
#
# One property to keep: nothing here registers a judge as an agent tool. See
# `search_service/judge/__init__.py` for why that matters.
judge:
  enabled: true
  forced_level: null
  # Which configured LLM provider judges. Null uses the default provider.
  provider: null
  # Fixed at 0 by `prototype.md` §4.3, alongside a fixed prompt and structured
  # output. Determinism here is a precondition for training, not a saving.
  temperature: 0.0
  # N_judge from `prototype.md` §4.1. L3a (N_sem = 100) and L3c (N_full = 8) are
  # declared for provenance and not implemented; asking for them is reported as
  # unsupported rather than silently served as L3b.
  max_papers_l3b: 30
  max_criteria_per_query: 8
  # NP_k^judge. Relative to this file; the carrier lives with the other preference
  # files because it is versioned by git like they are.
  carrier: "../../widis/.widi-scholar/preference/np-judge.md"

# Sidecar Reviewer detector thresholds (HP_k). Read by the scholar-search
# extension through GET /review-config, once per episode.
#
# They live here rather than in the extension's environment because they are
# HP_k, and config.yaml is the only authoritative carrier of HP_k - the edge
# theta^S_k = Configure(P, HP_k, NP_k^judge) starts here. Scattered across
# environment variables there would be nothing for an HP search to vary
# (docs/develop/decisions.md D-15).
#
# The detector *logic* deliberately stays in the extension: a detector reads
# PublicSearchTrace, an extension-side type assembled from WIDI's event stream,
# and mirroring that schema in Python would bind this service to WIDI's event
# shape. Thresholds are data and cheap to send; a trajectory is structure and
# would cost a duplicated schema.
#
# None of these numbers is derived from anything. They are placeholders that make
# the detectors runnable, and fixing them is the HP search's job
# (docs/reviewer-design.md §8, third risk).
review:
  # R1 - never probed the distribution.
  min_searches_before_facet_probe: 3
  # R2 - monotonous queries: pairwise Jaccard at or above this counts as "the
  # same question asked twice". 0.5 has no basis; it is a running value.
  subquery_jaccard_ceiling: 0.5
  min_subqueries_for_monotony: 2
  # R4 - expansion absent while there is plenty to expand from.
  min_evidence_before_expansion: 10
  # R5 - source imbalance.
  max_failures_per_source: 3
  # R6 - fetching without ever re-reading: get_paper per search_metadata.
  max_fetch_per_search_ratio: 1.0
  # R7 - budget nearly spent. A soft ceiling on tool calls, not a hard bound:
  # nothing enforces it, it only makes the Reviewer say so.
  soft_call_budget: 40

# LLM providers for the /judge forwarding endpoint. Keys are arbitrary names;
# the endpoint selects one by name or falls back to ``default``.
#
# Default provider mirrors the ``vllm`` entry in
# ``widis/.widi-scholar/agent/models.json``.
llm_providers:
  default: vllm

  providers:
    vllm:
      type: openai-compatible
      base_url: "http://192.168.163.112:8003/v1"
      # The upstream WIDI config uses "EMPTY" for key-less vLLM.
      api_key: "EMPTY"
      model: "qwen3.6-35b-a3b"
      timeout: 60.0
      max_retries: 2

    openai:
      type: openai-compatible
      base_url: "https://api.openai.com/v1"
      # Leave empty to read from OPENAI_API_KEY environment variable.
      api_key: ""
      model: "gpt-4o-mini"
      timeout: 60.0
      max_retries: 3

plugins:
  openalex:
    enabled: true
    role: primary
    # Leave empty to read from OPENALEX_API_KEY environment variable.
    api_key: ""
    # Leave empty to read from OPENALEX_MAILTO environment variable.
    mailto: ""
    base_url: "https://api.openalex.org"
    timeout: 30.0
    max_retries: 3
    per_page: 100
    rate_limit_rps: 10.0

    capabilities:
      search_keyword: true
      search_native_query: true
      search_field_filter: true
      facet_group_by: true
      id_lookup: true
      id_mapping: false
      graph_references: true
      graph_citations: true
      recommend_related: true
      metrics_raw_citations: true
      metrics_normalized: true
      text_abstract: true
      text_fulltext: false

    cost_model:
      works_search:
        usd_per_call: 0.001
        daily_quota: 1000
        rate_limit_rps: 10.0
      filter_query:
        usd_per_call: 0.0001
        daily_quota: 10000
        rate_limit_rps: 10.0
      group_by:
        usd_per_call: 0.0001
        daily_quota: 10000
        rate_limit_rps: 10.0
      single_work:
        usd_per_call: 0.0
        daily_quota: null
        rate_limit_rps: 10.0

    field_map:
      id: openalex_id
      display_name: title
      title: title
      publication_year: year
      publication_date: published
      doi: doi
      abstract_inverted_index: abstract
      authorships: authors
      primary_location: urls
      concepts: topics
      topics: topics
      keywords: keywords
      referenced_works: references
      related_works: related_works
      cited_by_api_url: citations
      cited_by_count: citation_count
      fwci: normalized_impact
      citation_normalized_percentile: citation_percentile
      counts_by_year: counts_by_year
      is_retracted: is_retracted
      is_paratext: is_paratext
      biblio: biblio
      mesh: mesh
      open_access: open_access

    reliability:
      p50_latency_ms: 500
      p95_latency_ms: 1500
      error_taxonomy: ["timeout", "rate_limit", "auth", "http", "parse", "unknown"]
      retry_policy: exponential
      max_retries: 3

  arxiv:
    enabled: true
    role: supplement
    base_url: "https://export.arxiv.org/api/query"
    timeout: 30.0
    max_retries: 2
    # arXiv polite usage: ~1 request per 3 seconds.
    rate_limit_rps: 0.33

    capabilities:
      search_keyword: true
      search_native_query: true
      search_field_filter: true
      facet_group_by: false
      id_lookup: true
      id_mapping: false
      graph_references: false
      graph_citations: false
      recommend_related: false
      metrics_raw_citations: false
      metrics_normalized: false
      text_abstract: true
      text_fulltext: true

    cost_model:
      atom_search:
        usd_per_call: 0.0
        daily_quota: null
        rate_limit_rps: 0.33
      single_paper:
        usd_per_call: 0.0
        daily_quota: null
        rate_limit_rps: 0.33

    field_map:
      id: arxiv_id
      title: title
      summary: abstract
      published: published
      updated: updated
      author: authors
      arxiv:comment: comment
      arxiv:affiliation: affiliation
      category: category
      link: urls

    reliability:
      p50_latency_ms: 800
      p95_latency_ms: 3000
      error_taxonomy: ["timeout", "rate_limit", "http", "parse", "unknown"]
      retry_policy: exponential
      max_retries: 2

  # Serper is disabled in P0. The plugin file remains in place so it can be
  # re-enabled by setting enabled: true without modifying pipeline code.
  serper:
    enabled: false
    role: disabled
    # Leave empty to read from SERPER_API_KEY environment variable.
    api_key: ""
    base_url: "https://google.serper.dev"
    timeout: 30.0
    max_retries: 2
    rate_limit_rps: 1.0
    query_template: "{query} filetype:pdf OR arxiv.org OR doi.org"

    capabilities:
      search_keyword: true
      search_native_query: false
      search_field_filter: false
      facet_group_by: false
      id_lookup: false
      id_mapping: false
      graph_references: false
      graph_citations: false
      recommend_related: false
      metrics_raw_citations: false
      metrics_normalized: false
      text_abstract: false
      text_fulltext: false

    cost_model:
      search:
        usd_per_call: 0.0
        daily_quota: null
        rate_limit_rps: 1.0

    field_map:
      title: title
      link: urls
      snippet: abstract

    reliability:
      p50_latency_ms: 600
      p95_latency_ms: 1500
      error_taxonomy: ["timeout", "rate_limit", "auth", "http", "parse", "unknown"]
      retry_policy: exponential
      max_retries: 2
