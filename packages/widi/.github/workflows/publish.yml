name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test

      - name: Publish @arcadialin/agent-core
        run: npm --workspace @arcadialin/agent-core publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for agent-core to be visible on the registry
        run: |
          for i in $(seq 1 30); do
            npm view "@arcadialin/agent-core@$(node -p "require('./packages/agent/package.json').version")" version && exit 0
            sleep 10
          done
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arcadialin/widi
        run: npm --workspace apps/widi publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
